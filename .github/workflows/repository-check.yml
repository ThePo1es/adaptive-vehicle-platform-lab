name: repository-check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository structure and internal links
        run: bash scripts/check_repo.sh

