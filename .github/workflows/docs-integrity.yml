name: docs-integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          checksum: b23350c79e8ad0192b8124af13a0f17e8d4e4549524785e1aef389ae5a06990e

      - name: Provision the hash-locked replay toolchain
        run: uv sync --project toolchain --locked --python 3.12.13

      - name: Prepare the historical Python entry point
        shell: bash
        run: |
          replay_bin="$(cygpath -u "$RUNNER_TEMP")/replay-bin"
          git_bash_exe="$(command -v bash)"
          git_bash_bin="$(dirname "$git_bash_exe")"
          mkdir -p "$replay_bin"
          printf '%s\n' '#!/usr/bin/bash' 'exec python "$@"' > "$replay_bin/python3"
          chmod +x "$replay_bin/python3"
          cygpath -w "$replay_bin" >> "$GITHUB_PATH"
          cygpath -w "$git_bash_bin" >> "$GITHUB_PATH"
          printf 'GIT_BASH_EXE=%s\n' "$(cygpath -w "$git_bash_exe")" >> "$GITHUB_ENV"

      - name: Verify the nested Windows replay tools
        shell: bash
        run: |
          uv run --project toolchain --locked --no-sync --offline \
            python -c "import os, pathlib; bash = pathlib.Path(os.environ['GIT_BASH_EXE']); print(bash); assert bash.is_file()"

      - name: Validate curriculum structure, links and traceability
        shell: bash
        run: |
          uv run --project toolchain --locked --no-sync --offline \
            bash scripts/check_repo.sh
