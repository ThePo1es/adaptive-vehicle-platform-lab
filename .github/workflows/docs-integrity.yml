name: docs-integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.13

      - name: Validate curriculum structure, links and traceability
        run: bash scripts/check_repo.sh
