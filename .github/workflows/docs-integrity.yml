name: docs-integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Provision the pinned replay toolchain
        run: >-
          uv run --python 3.12.13 --with ziglang==0.15.2
          python -c "import ziglang; print(ziglang.__file__)"

      - name: Prepare the historical Python entry point
        shell: bash
        run: |
          replay_bin="$(cygpath -u "$RUNNER_TEMP")/replay-bin"
          git_bash_bin="$(dirname "$(command -v bash)")"
          mkdir -p "$replay_bin"
          printf '%s\n' '#!/usr/bin/bash' 'exec python "$@"' > "$replay_bin/python3"
          printf '%s\n' 'hash -p /usr/bin/bash bash' > "$replay_bin/bash-env"
          chmod +x "$replay_bin/python3"
          cygpath -w "$replay_bin" >> "$GITHUB_PATH"
          cygpath -w "$git_bash_bin" >> "$GITHUB_PATH"
          printf 'BASH_ENV=%s\n' "$replay_bin/bash-env" >> "$GITHUB_ENV"

      - name: Verify the nested Windows replay tools
        shell: bash
        run: |
          uv run --offline --python 3.12.13 --with ziglang==0.15.2 \
            python -c "import shutil; bash = shutil.which('bash'); print(bash); assert bash and 'git' in bash.casefold()"
          test "$(hash -t bash)" = /usr/bin/bash

      - name: Verify the historical replay bootstrap
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SKIP_RUNNABLE_EVIDENCE: "1"
        run: |
          replay_root="$(cygpath -u "$RUNNER_TEMP")/historical-replay"
          mkdir -p "$replay_root"
          git archive d7a23caff2d5c151b2782ee547aa66b113d97a3f | tar -xf - -C "$replay_root"
          cd "$replay_root"
          uv run --offline --python 3.12.13 --with ziglang==0.15.2 \
            bash scripts/check_repo.sh

      - name: Validate curriculum structure, links and traceability
        shell: bash
        run: |
          uv run --offline --python 3.12.13 --with ziglang==0.15.2 \
            bash scripts/check_repo.sh
