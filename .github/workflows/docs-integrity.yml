name: docs-integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Provision the pinned replay toolchain
        run: >-
          uv run --python 3.12.13 --with ziglang==0.15.2 --with pyelftools==0.32
          python -c "import elftools, ziglang; print(elftools.__version__, ziglang.__file__)"

      - name: Prepare the historical Python entry point
        shell: bash
        run: |
          replay_bin="$(cygpath -u "$RUNNER_TEMP")/replay-bin"
          git_bash_exe="$(command -v bash)"
          git_bash_bin="$(dirname "$git_bash_exe")"
          mkdir -p "$replay_bin"
          printf '%s\n' '#!/usr/bin/bash' 'exec python "$@"' > "$replay_bin/python3"
          chmod +x "$replay_bin/python3"
          cygpath -w "$replay_bin" >> "$GITHUB_PATH"
          cygpath -w "$git_bash_bin" >> "$GITHUB_PATH"
          printf 'GIT_BASH_EXE=%s\n' "$(cygpath -w "$git_bash_exe")" >> "$GITHUB_ENV"

      - name: Verify the nested Windows replay tools
        shell: bash
        run: |
          uv run --offline --python 3.12.13 --with ziglang==0.15.2 --with pyelftools==0.32 \
            python -c "import os, pathlib; bash = pathlib.Path(os.environ['GIT_BASH_EXE']); print(bash); assert bash.is_file()"

      - name: Validate curriculum structure, links and traceability
        shell: bash
        run: |
          uv run --offline --python 3.12.13 --with ziglang==0.15.2 --with pyelftools==0.32 \
            bash scripts/check_repo.sh
