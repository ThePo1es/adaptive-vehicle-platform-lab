name: code-build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  g1-safe-c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Provision the pinned Python, test and C toolchains
        run: >-
          uv run --python 3.12.13 --with pytest==9.1.1 --with ziglang==0.15.2
          python -c "import pytest, ziglang; print(pytest.__version__, ziglang.__file__)"

      - name: Run Python harness tests without network access
        run: >-
          uv run --offline --python 3.12.13 --with pytest==9.1.1 --with ziglang==0.15.2
          pytest -q scripts/tests labs/g01_safe_c/tests

      - name: Build and run every G1 Safe C lab
        env:
          G01_LAB_ID: G1.ALL
        run: >-
          uv run --offline --python 3.12.13 --with ziglang==0.15.2
          python -m labs.g01_safe_c.run_harness

      - name: Run the independent G1 retest input set
        env:
          G01_LAB_ID: G1.RETEST
        run: >-
          uv run --offline --python 3.12.13 --with ziglang==0.15.2
          python -m labs.g01_safe_c.run_harness

      - name: Build, test and install the portfolio release scaffold
        run: |
          uv run --python 3.12.13 --with cmake==3.31.6 --with ninja==1.11.1.4 \
            cmake -S portfolio/g01-safe-c-components-v1 -B build/g01-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          uv run --offline --python 3.12.13 --with cmake==3.31.6 --with ninja==1.11.1.4 \
            cmake --build build/g01-release
          uv run --offline --python 3.12.13 --with cmake==3.31.6 --with ninja==1.11.1.4 \
            ctest --test-dir build/g01-release --output-on-failure
          uv run --offline --python 3.12.13 --with cmake==3.31.6 --with ninja==1.11.1.4 \
            cmake --install build/g01-release --prefix build/g01-install
