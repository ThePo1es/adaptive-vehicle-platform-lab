name: code-build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  g1-safe-c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101

      - name: Provision the hash-locked toolchain
        run: uv sync --project toolchain --locked --python 3.12.13

      - name: Run Python harness tests without network access
        run: >-
          uv run --project toolchain --locked --no-sync --offline
          pytest -q scripts/tests labs/g01_safe_c/tests

      - name: Build and run every G1 Safe C lab
        env:
          G01_LAB_ID: G1.ALL
        run: >-
          uv run --project toolchain --locked --no-sync --offline
          python -m labs.g01_safe_c.run_harness

      - name: Run the independent G1 retest input set
        env:
          G01_LAB_ID: G1.RETEST
        run: >-
          uv run --project toolchain --locked --no-sync --offline
          python -m labs.g01_safe_c.run_harness

      - name: Build, test and install the portfolio release scaffold
        run: |
          uv run --project toolchain --locked --no-sync --offline \
            cmake -S portfolio/g01-safe-c-components-v1 -B build/g01-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          uv run --project toolchain --locked --no-sync --offline \
            cmake --build build/g01-release
          uv run --project toolchain --locked --no-sync --offline \
            ctest --test-dir build/g01-release --output-on-failure
          uv run --project toolchain --locked --no-sync --offline \
            cmake --install build/g01-release --prefix build/g01-install

  g2-embedded-cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          checksum: 600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101

      - name: Provision the hash-locked toolchain
        run: uv sync --project toolchain --locked --python 3.12.13

      - name: Run the G2 Python harness tests without network access
        run: >-
          uv run --project toolchain --locked --no-sync --offline
          pytest -q labs/g02_embedded_cpp/tests

      - name: Build and run every G2 Embedded C++ lab
        env:
          G02_LAB_ID: G2.ALL
        run: >-
          uv run --project toolchain --locked --no-sync --offline
          python -m labs.g02_embedded_cpp.run_harness

      - name: Run the independent G2 retest input set
        env:
          G02_LAB_ID: G2.RETEST
        run: >-
          uv run --project toolchain --locked --no-sync --offline
          python -m labs.g02_embedded_cpp.run_harness

      - name: Build, test and install the G2 portfolio release
        run: |
          uv run --project toolchain --locked --no-sync --offline \
            cmake -S portfolio/g02-embedded-cpp-runtime-v1 -B build/g02-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          uv run --project toolchain --locked --no-sync --offline \
            cmake --build build/g02-release
          uv run --project toolchain --locked --no-sync --offline \
            ctest --test-dir build/g02-release --output-on-failure
          uv run --project toolchain --locked --no-sync --offline \
            cmake --install build/g02-release --prefix build/g02-install
