name: code-build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  g1-safe-c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3

      - name: Run Python harness tests
        run: uv run --python 3.12.13 --with pytest==9.1.1 pytest -q scripts/tests labs/g01_safe_c/tests

      - name: Build and run every G1 Safe C lab
        env:
          G01_LAB_ID: G1.ALL
        run: uv run --python 3.12.13 labs/g01_safe_c/run_harness.py
