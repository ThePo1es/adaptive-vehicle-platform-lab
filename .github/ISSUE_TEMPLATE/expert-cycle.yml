name: Expert cycle evidence
description: G11 이후 유지보수·이식·연구·교육을 Level 5 증거로 관리합니다.
title: "[Expert EX] "
labels:
  - expert-cycle
body:
  - type: dropdown
    id: cycle
    attributes:
      label: Cycle
      options:
        - E1 Subsystem Maintainer
        - E2 Cross-target Portability
        - E3 Performance/Reliability Research
        - E4 Architecture/Teaching
    validations:
      required: true

  - type: input
    id: subsystem
    attributes:
      label: Focus subsystem
      placeholder: LLVM AArch64 backend / Zephyr CAN / Linux ISO-TP / vsomeip SD
    validations:
      required: true

  - type: textarea
    id: challenge
    attributes:
      label: New problem and falsifiable outcome
      description: 기존 답을 재현하는 일이 아니라 처음 해결할 문제와 실패 기준을 적습니다.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence plan
      placeholder: |
        - Upstream source/issues/releases:
        - Reproduction and regression:
        - Target transfer:
        - Raw measurement:
        - External feedback:
        - Review/teaching:
    validations:
      required: true

  - type: textarea
    id: limits
    attributes:
      label: Known limits and next research question
    validations:
      required: true
