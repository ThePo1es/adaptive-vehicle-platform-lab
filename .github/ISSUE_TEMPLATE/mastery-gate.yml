name: Mastery gate review
description: 다음 Gate로 이동하기 전에 독립 구현·진단·측정·설계 증거를 심사합니다.
title: "[Gate GNN] mastery review"
labels:
  - mastery-gate
body:
  - type: dropdown
    id: gate
    attributes:
      label: Gate
      options:
        - G0 Engineering Baseline
        - G1 Systems C
        - G2 Embedded C++
        - G3 ARM ABI and LLVM
        - G4 Bare-metal Cortex-M
        - G5 RTOS and real-time analysis
        - G6 CAN and diagnostics
        - G7 Classic Platform concepts
        - G8 Linux platform and BSP
        - G9 Ethernet vehicle services
        - G10 Adaptive Platform concepts
        - G11 Safety security and update
        - G12 Architecture and integration
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence index
      description: Commit, test, report, raw data, packet/trace와 재현 명령을 연결합니다.
      placeholder: |
        - Implementation:
        - Automated tests:
        - Fault campaign:
        - Measurement/raw data:
        - Architecture/ADR:
        - Clean-room reproduction:
    validations:
      required: true

  - type: textarea
    id: exams
    attributes:
      label: Independent assessment
      description: Solo task, transfer와 sealed-fault 시험의 조건·결과를 기록합니다.
      placeholder: |
        | Exam | Time limit | Result | Evidence/reviewer |
        | --- | ---: | --- | --- |
        | Solo / transfer task | 120 min |  |  |
        | Sealed-fault diagnosis | 90 min |  |  |
        | Measurement or design defense | 45 min |  |  |
    validations:
      required: true

  - type: textarea
    id: scorecard
    attributes:
      label: Observable anchors
      description: 각 항목을 Fail, Pass, Strong 중 하나로 평가하고 관찰을 적습니다.
      value: |
        | Dimension | Result | Evidence |
        | --- | --- | --- |
        | Correctness |  |  |
        | Diagnosis |  |  |
        | Measurement |  |  |
        | Design |  |  |
        | Reliability |  |  |
        | Independence |  |  |
        | Reproducibility |  |  |
    validations:
      required: true

  - type: textarea
    id: gaps
    attributes:
      label: Unverified assumptions and residual risks
      description: 실패·미확인·외부 리뷰 지적과 보완 또는 재시험 날짜를 적습니다.
    validations:
      required: true

  - type: checkboxes
    id: decision
    attributes:
      label: Promotion decision
      options:
        - label: 모든 항목이 Pass 이상이며 Gate 중점 항목 두 개가 Strong이다.
          required: true
        - label: critical safety/security invariant 실패가 없다.
          required: true
        - label: clean-room reproduction을 제3자 또는 격리 환경에서 통과했다.
          required: true
        - label: 다음 분기 누적 시험에서 표본화할 기술을 등록했다.
          required: true
