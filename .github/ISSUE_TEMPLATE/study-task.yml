name: Study task
description: 한 주의 학습 질문, 근거, 실험, 통과 기준을 정의합니다.
title: "[Study WNN] "
labels:
  - study
body:
  - type: input
    id: week
    attributes:
      label: Week
      description: 두 자리 주차를 입력합니다.
      placeholder: "02"
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: Questions to answer
      description: 이번 작업으로 답할 수 있어야 하는 기술 질문을 1–3개 작성합니다.
      placeholder: |
        1. State Management와 Execution Management의 책임은 어디서 나뉘는가?
        2. 그 경계를 코드와 테스트로 어떻게 증명할 것인가?
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: 공식 사양, 공식 문서, source file 또는 commit을 적습니다.
      placeholder: |
        - AUTOSAR AP Software Architecture R25-11, relevant section
        - upstream source/test link
    validations:
      required: true

  - type: textarea
    id: experiment
    attributes:
      label: Minimal experiment
      description: 어떤 가설을 어떤 입력과 관찰값으로 검증할지 작성합니다.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ] 학습 노트가 자기 말로 작성되어 있다.
        - [ ] 명령과 환경을 포함한 재현 절차가 있다.
        - [ ] 적어도 하나의 실패 또는 오류 경로를 확인했다.
        - [ ] 근거와 내 실험의 관계가 명시되어 있다.
        - [ ] 불확실한 내용은 Unverified로 표시했다.
    validations:
      required: true

  - type: dropdown
    id: safety
    attributes:
      label: Test environment
      options:
        - vcan / local simulation
        - Owned or authorized bench hardware
        - Parked vehicle, receive-only
    validations:
      required: true

